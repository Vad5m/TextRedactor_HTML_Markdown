<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Документы .vd5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    padding: 40px 20px;
    color: #0f172a;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { color: #64748b; font-size: 14px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 10px;
    border: none; cursor: pointer;
    font-size: 14px; font-family: inherit; font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #1e293b; color: #f1f5f9; }
  .btn-primary:hover { background: #334155; }
  .btn-ghost { background: #ffffff; color: #334155; border: 1px solid #e2e8f0; }
  .btn-ghost:hover { background: #f8fafc; }

  .doc-list { display: flex; flex-direction: column; gap: 10px; }
  .doc-item {
    display: flex; align-items: center; gap: 14px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
  }
  .doc-item:hover {
    border-color: #3b82f6;
    box-shadow: 0 6px 20px rgba(59,130,246,0.12);
    transform: translateY(-1px);
  }
  .doc-icon {
    width: 40px; height: 40px; flex-shrink: 0;
    background: #eff6ff; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #3b82f6;
  }
  .doc-icon svg { width: 22px; height: 22px; stroke: currentColor; }
  .doc-info { flex: 1; min-width: 0; }
  .doc-name {
    font-weight: 600; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .doc-meta {
    font-size: 12px; color: #94a3b8; margin-top: 2px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .doc-arrow { color: #cbd5e1; flex-shrink: 0; }
  .doc-item:hover .doc-arrow { color: #3b82f6; }

  .empty {
    text-align: center; padding: 60px 20px;
    background: #ffffff; border: 1px dashed #cbd5e1; border-radius: 12px;
    color: #94a3b8;
  }
  .empty code {
    background: #f1f5f9; padding: 2px 6px; border-radius: 4px;
    color: #334155; font-size: 13px;
  }
  .loading { text-align: center; padding: 40px; color: #94a3b8; }
  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 2px solid #e2e8f0; border-top-color: #3b82f6;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📄 Документы .vd5</h1>
    <p class="subtitle">Выберите документ для открытия в редакторе или создайте новый.</p>
  </header>

  <div class="toolbar">
    <a class="btn btn-primary" href="/api/new-document">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Новый документ
    </a>
    <button class="btn btn-ghost" id="refreshBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Обновить список
    </button>
  </div>

  <div id="listContainer" class="doc-list">
    <div class="loading"><span class="spinner"></span>Загрузка списка документов…</div>
  </div>
</div>

<script>
  const listContainer = document.getElementById('listContainer');

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function formatSize(bytes) {
    bytes = parseInt(bytes, 10) || 0;
    if (bytes === 0) return '0 Б';
    const k = 1024;
    const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function renderList(docs) {
    if (!docs || docs.length === 0) {
      listContainer.innerHTML = `
        <div class="empty">
          <p style="font-size:16px;margin-bottom:8px;">Пока нет документов</p>
          <p>Нажмите «Новый документ» или положите <code>.vd5</code> файлы в папку <code>data/docs/</code></p>
        </div>`;
      return;
    }

    listContainer.innerHTML = docs.map(doc => `
      <a class="doc-item" href="/editor?id=${encodeURIComponent(doc.id)}&admin=1">
        <span class="doc-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
            <polyline points="13 2 13 9 20 9"/>
          </svg>
        </span>
        <span class="doc-info">
          <div class="doc-name">${escapeHtml(doc.title || doc.id)}</div>
          <div class="doc-meta">
            <span>ID: ${escapeHtml(doc.id)}</span>
            ${doc.savedAt ? `<span>Изменён: ${formatDate(doc.savedAt)}</span>` : ''}
            ${doc.size ? `<span>${formatSize(doc.size)}</span>` : ''}
          </div>
        </span>
        <span class="doc-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </span>
      </a>
    `).join('');
  }

  function loadList() {
    listContainer.innerHTML = `<div class="loading"><span class="spinner"></span>Загрузка списка документов…</div>`;
    fetch('/api/documents')
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data)) renderList(data);
        else if (data && Array.isArray(data.documents)) renderList(data.documents);
        else renderList([]);
      })
      .catch(err => {
        listContainer.innerHTML = `<div class="empty" style="color:#ef4444;">Ошибка загрузки списка: ${escapeHtml(err.message)}</div>`;
      });
  }

  document.getElementById('refreshBtn').addEventListener('click', loadList);
  loadList();
</script>
</body>
</html>
