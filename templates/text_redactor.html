<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
display: flex;
background: #f0f2f5;
font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
overflow: hidden;
position: relative;
}
.toggle-btn {
position: fixed; top: 50%; left: 0;
transform: translateY(-50%);
z-index: 200;
width: 32px; height: 60px;
background: #1e293b; color: #f1f5f9;
border: none; border-radius: 0 12px 12px 0;
font-size: 20px; font-weight: 300;
cursor: pointer;
transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s;
display: flex; align-items: center; justify-content: center;
box-shadow: 2px 0 12px rgba(0, 0, 0, 0.1);
}
.toggle-btn:hover { background: #334155; }
.toggle-btn.open { left: 64px; }
.sidebar {
position: fixed; top: 50%; left: -64px;
transform: translateY(-50%);
width: 64px; height: 560px;
background: #1e293b;
display: flex; flex-direction: column;
align-items: center; padding: 12px 0; gap: 5px;
box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
z-index: 100; border-radius: 0 16px 16px 0;
overflow: visible;
transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.sidebar.open { left: 0; }
.sidebar::before,
.sidebar::after {
content: ''; position: absolute; left: -40px;
width: 80px; height: 80px; background: #1e293b; z-index: -1;
}
.sidebar::before {
top: -40px;
mask-image: radial-gradient(circle at 100% 0%, transparent 40px, black 40px);
-webkit-mask-image: radial-gradient(circle at 100% 0%, transparent 40px, black 40px);
}
.sidebar::after {
bottom: -40px;
mask-image: radial-gradient(circle at 100% 100%, transparent 40px, black 40px);
-webkit-mask-image: radial-gradient(circle at 100% 100%, transparent 40px, black 40px);
}
.sidebar button {
width: 44px; height: 33px;
border: none; background: #334155; color: #f1f5f9;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
flex-shrink: 0; border-radius: 0 10px 10px 0;
position: relative; z-index: 1;
padding: 0;
transition: background 0.15s, transform 0.3s ease;
}
.sidebar button:hover { background: #475569; transform: rotate(15deg); }
.sidebar button:active { background: #0f172a; transform: scale(0.92) rotate(15deg); }
.sidebar button svg,
.sidebar button img {
width: 20px; height: 20px; display: block; pointer-events: none;
}
.sidebar button svg { stroke: #f1f5f9; }
.sidebar button img.icon-white {
filter: brightness(0) invert(1);
}
.sidebar .text-icon {
font-size: 18px;
font-weight: 700;
font-family: 'Georgia', serif;
line-height: 1;
pointer-events: none;
}
.sidebar .sidebar-sep {
width: 40px; height: 1px; background: #475569; margin: 4px 0;
flex-shrink: 0;
}
.top-controls {
position: fixed;
top: 12px;
right: 12px;
display: flex;
align-items: center;
gap: 6px;
z-index: 600;
background: #1e293b;
padding: 6px;
border-radius: 14px;
box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
}
.top-controls button {
width: 36px;
height: 36px;
border: none;
background: #334155;
border-radius: 9px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
padding: 0;
transition: background 0.15s, transform 0.1s, opacity 0.15s;
}
.top-controls button:hover:not(:disabled) { background: #475569; transform: translateY(-1px); }
.top-controls button:active:not(:disabled) { background: #0f172a; transform: scale(0.94); }
.top-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
.top-controls button img {
width: 20px; height: 20px;
display: block;
pointer-events: none;
filter: brightness(0) invert(1);
}
.main-area {
margin-left: 0; width: 100%; height: 100vh;
display: flex; align-items: stretch;
transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1),
width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.main-area.shifted {
margin-left: 64px;
width: calc(100% - 64px);
}
.editor-container {
width: 100%; height: 100%;
padding: 20px 30px;
padding-top: 64px;
background: #f8fafc;
overflow-y: auto;
position: relative;
}
#editor {
width: 100%; height: 100%;
border: none; outline: none;
font-size: 18px; font-family: inherit;
color: #0f172a; line-height: 1.6;
background: transparent; resize: none;
overflow-y: auto;
white-space: pre-wrap; word-wrap: break-word;
}
#editor:empty::before {
content: 'Введите текст...';
color: #94a3b8;
}
#editor:focus:empty::before { content: ''; }
#editor.readonly { cursor: default; }
#editor.readonly:empty::before { content: ''; }
.save-indicator {
position: fixed;
bottom: 16px;
right: 20px;
background: #1e293b;
color: #f1f5f9;
font-size: 12px;
padding: 6px 12px;
border-radius: 20px;
box-shadow: 0 4px 14px rgba(0,0,0,0.2);
opacity: 0;
transform: translateY(6px);
transition: opacity 0.25s, transform 0.25s, background 0.25s;
pointer-events: none;
z-index: 400;
display: flex;
align-items: center;
gap: 6px;
}
.save-indicator.show { opacity: 1; transform: translateY(0); }
.save-indicator.saving { background: #3b82f6; }
.save-indicator.saved { background: #16a34a; }
.save-indicator.error { background: #ef4444; }
.floating-toolbar {
position: fixed; background: #1e293b;
padding: 8px 14px; border-radius: 16px;
display: flex; gap: 6px;
box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
z-index: 300; opacity: 0;
transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
pointer-events: none; align-items: center;
transform: scale(0.95) translateY(4px);
top: 0; left: 0;
}
.floating-toolbar.show {
opacity: 1;
transform: scale(1) translateY(0);
pointer-events: auto;
}
.floating-toolbar button {
background: transparent; border: none; color: #f1f5f9;
font-size: 18px; padding: 6px 10px; border-radius: 8px;
cursor: pointer;
transition: background 0.15s, transform 0.15s;
font-family: inherit; line-height: 1;
min-width: 36px;
display: flex; align-items: center; justify-content: center;
}
.floating-toolbar button:hover { background: #334155; transform: scale(1.05); }
.floating-toolbar button:active { background: #0f172a; transform: scale(0.92); }
.floating-toolbar button.active { background: #3b82f6; color: white; }
.floating-toolbar button svg,
.floating-toolbar button img {
width: 20px; height: 20px; display: block; pointer-events: none;
}
.floating-toolbar button svg { stroke: #f1f5f9; }
.floating-toolbar button img.icon-white {
filter: brightness(0) invert(1);
}
.floating-toolbar .divider {
width: 1px; height: 28px; background: #475569; margin: 0 4px;
}
.floating-toolbar .tool-label {
color: #94a3b8; font-size: 11px; font-weight: 500;
letter-spacing: 0.5px; text-transform: uppercase;
padding-right: 4px;
}
.context-menu {
position: fixed;
background: #ffffff;
border: 1px solid #e2e8f0;
border-radius: 12px;
box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
padding: 6px;
z-index: 500;
min-width: 230px;
opacity: 0;
transform: scale(0.95) translateY(-4px);
pointer-events: none;
transition: opacity 0.15s ease, transform 0.15s ease;
}
.context-menu.show {
opacity: 1;
transform: scale(1) translateY(0);
pointer-events: auto;
}
.context-menu .menu-title {
font-size: 11px;
font-weight: 600;
color: #94a3b8;
text-transform: uppercase;
letter-spacing: 0.5px;
padding: 6px 10px 4px;
}
.context-menu button {
display: flex;
align-items: center;
gap: 10px;
width: 100%;
background: transparent;
border: none;
color: #0f172a;
font-size: 14px;
font-family: inherit;
padding: 8px 10px;
border-radius: 8px;
cursor: pointer;
text-align: left;
transition: background 0.12s;
}
.context-menu button:hover { background: #f1f5f9; }
.context-menu button:active { background: #e2e8f0; }
.context-menu button.danger { color: #ef4444; }
.context-menu button.danger:hover { background: #fef2f2; }
.context-menu .menu-icon {
width: 18px;
height: 18px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
color: #0f172a;
}
.context-menu .menu-icon svg,
.context-menu .menu-icon img {
width: 18px;
height: 18px;
display: block;
stroke: currentColor;
}
.context-menu .menu-icon img {
filter: brightness(0) saturate(100%) invert(15%) sepia(15%) saturate(1000%) hue-rotate(190deg) brightness(95%) contrast(95%);
}
.context-menu button.danger .menu-icon svg {
stroke: #ef4444;
}
.context-menu .menu-sep {
height: 1px;
background: #e2e8f0;
margin: 4px 6px;
}
.inserted-image {
max-width: 100%;
height: auto;
border-radius: 8px;
margin: 4px 0;
display: block;
cursor: pointer;
transition: box-shadow 0.15s;
}
.inserted-image.selected {
box-shadow: 0 0 0 3px #3b82f6, 0 4px 12px rgba(59,130,246,0.3);
}
.inserted-video {
position: relative;
max-width: 100%;
border-radius: 8px;
margin: 4px 0;
display: block;
cursor: pointer;
transition: box-shadow 0.15s;
overflow: hidden;
background: #000;
}
.inserted-video video {
width: 100%;
height: 100%;
object-fit: contain;
display: block;
}
.inserted-video.selected {
box-shadow: 0 0 0 3px #3b82f6, 0 4px 12px rgba(59,130,246,0.3);
}
.video-controls-overlay {
position: absolute;
left: 0;
right: 0;
bottom: 0;
padding: 8px 12px 12px;
background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 60%, transparent);
display: flex;
flex-direction: column;
gap: 6px;
z-index: 10;
opacity: 0;
pointer-events: none;
transition: opacity 0.25s;
}
.inserted-video:hover .video-controls-overlay,
.inserted-video.selected .video-controls-overlay {
opacity: 1;
pointer-events: auto;
}
.video-progress-area {
display: flex;
align-items: center;
gap: 8px;
}
.video-time-display {
color: #f0f0ff;
font-size: 0.75rem;
font-variant-numeric: tabular-nums;
min-width: 40px;
text-align: center;
letter-spacing: 0.3px;
text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.video-progress-bar {
flex: 1;
height: 4px;
border-radius: 6px;
background: rgba(255, 255, 255, 0.25);
cursor: pointer;
position: relative;
transition: height 0.15s;
overflow: hidden;
}
.video-progress-bar:hover { height: 6px; }
.video-progress-fill {
height: 100%;
width: 0%;
background: #ff3b3b;
border-radius: 6px;
will-change: width;
}
.video-buttons-row {
display: flex;
align-items: center;
gap: 8px;
color: #fff;
}
.video-control-group {
display: flex;
align-items: center;
gap: 6px;
position: relative;
}
.video-icon-btn {
background: none;
border: none;
color: #fff;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
width: 28px;
height: 28px;
border-radius: 50%;
transition: background 0.15s;
padding: 0;
}
.video-icon-btn:hover { background: rgba(255, 255, 255, 0.15); }
.video-icon-btn svg {
width: 18px;
height: 18px;
fill: currentColor;
pointer-events: none;
}
.video-volume-wrapper {
position: relative;
width: 70px;
height: 4px;
border-radius: 6px;
background: rgba(255, 255, 255, 0.25);
overflow: hidden;
}
.video-volume-fill {
position: absolute;
top: 0;
left: 0;
height: 100%;
width: 100%;
background: #ff3b3b;
border-radius: 6px;
pointer-events: none;
}
.video-volume-slider {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
-webkit-appearance: none;
appearance: none;
background: transparent;
outline: none;
cursor: pointer;
margin: 0;
opacity: 0;
}
.video-speed-select {
background: rgba(0, 0, 0, 0.55);
color: #fff;
border: 1px solid rgba(255, 255, 255, 0.3);
border-radius: 4px;
padding: 3px 6px;
font-size: 0.75rem;
cursor: pointer;
outline: none;
font-family: inherit;
transition: background 0.15s;
}
.video-speed-select:hover { background: rgba(0, 0, 0, 0.75); }
.video-speed-select option { background: #1e1e24; color: #fff; }

.inserted-file {
display: inline-flex;
align-items: center;
gap: 8px;
background: #e2e8f0;
color: #0f172a;
padding: 6px 12px;
border-radius: 8px;
margin: 2px 0;
font-size: 14px;
cursor: pointer;
text-decoration: none;
border: 1px solid #cbd5e1;
transition: background 0.15s, box-shadow 0.15s;
user-select: none;
}
.inserted-file:hover { background: #cbd5e1; }
.inserted-file.selected {
box-shadow: 0 0 0 3px #3b82f6, 0 4px 12px rgba(59,130,246,0.3);
background: #dbeafe;
}
.inserted-file .file-icon {
display: flex;
align-items: center;
justify-content: center;
width: 20px;
height: 20px;
flex-shrink: 0;
}
.inserted-file .file-icon img,
.inserted-file .file-icon svg {
width: 20px;
height: 20px;
display: block;
stroke: #0f172a;
}
.inserted-file .file-icon img {
filter: brightness(0) saturate(100%) invert(15%) sepia(15%) saturate(1000%) hue-rotate(190deg) brightness(95%) contrast(95%);
}
.inserted-file .file-name { font-weight: 600; }
.inserted-file .file-size { color: #64748b; font-size: 12px; }
.inserted-file.uploading { opacity: 0.6; pointer-events: none; }
.inserted-file.uploading .file-size::after { content: ' …'; }
.inserted-file.error {
background: #fef2f2;
border-color: #fecaca;
color: #ef4444;
}
.inserted-link {
display: inline-flex;
flex-direction: column;
gap: 2px;
background: #eff6ff;
border: 1px solid #bfdbfe;
border-radius: 8px;
padding: 6px 12px;
margin: 2px 0;
cursor: pointer;
text-decoration: none;
transition: background 0.15s, box-shadow 0.15s;
user-select: none;
max-width: 100%;
vertical-align: middle;
}
.inserted-link:hover { background: #dbeafe; }
.inserted-link.selected {
box-shadow: 0 0 0 3px #3b82f6, 0 4px 12px rgba(59,130,246,0.3);
}
.inserted-link .link-title {
font-weight: 600;
font-size: 14px;
color: #1e40af;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.inserted-link .link-url {
font-size: 12px;
color: #3b82f6;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.resize-handle {
position: absolute;
width: 28px;
height: 28px;
background: #1e293b;
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
cursor: nw-resize;
z-index: 999;
box-shadow: 0 4px 14px rgba(0,0,0,0.35);
border: 2px solid #ffffff;
transition: transform 0.1s, background 0.15s;
user-select: none;
pointer-events: auto;
}
.resize-handle:hover { background: #3b82f6; transform: scale(1.1); }
.resize-handle:active { background: #2563eb; transform: scale(0.95); }
.resize-handle svg {
width: 18px; height: 18px;
display: block;
pointer-events: none;
stroke: #ffffff;
}
.align-handle {
position: absolute;
width: 28px;
height: 28px;
background: #1e293b;
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
z-index: 999;
box-shadow: 0 4px 14px rgba(0,0,0,0.35);
border: 2px solid #ffffff;
transition: transform 0.1s, background 0.15s;
user-select: none;
pointer-events: auto;
}
.align-handle:hover { background: #3b82f6; transform: scale(1.1); }
.align-handle:active { background: #2563eb; transform: scale(0.95); }
.align-handle svg {
width: 18px; height: 18px;
display: block;
pointer-events: none;
stroke: #ffffff;
}
.delete-handle {
position: absolute;
width: 28px;
height: 28px;
background: #ef4444;
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
z-index: 999;
box-shadow: 0 4px 14px rgba(0,0,0,0.35);
border: 2px solid #ffffff;
transition: transform 0.1s, background 0.15s;
user-select: none;
pointer-events: auto;
}
.delete-handle:hover { background: #dc2626; transform: scale(1.1); }
.delete-handle:active { background: #b91c1c; transform: scale(0.95); }
.delete-handle svg {
width: 18px; height: 18px;
display: block;
pointer-events: none;
stroke: #ffffff;
}
.drop-indicator {
position: fixed;
left: 0;
right: 0;
height: 3px;
background: #3b82f6;
z-index: 1000;
pointer-events: none;
opacity: 0;
transition: opacity 0.15s;
box-shadow: 0 0 8px rgba(59,130,246,0.8);
}
.drop-indicator.show { opacity: 1; }
.drop-indicator::before {
content: '';
position: absolute;
left: -4px;
top: -4px;
width: 11px;
height: 11px;
background: #3b82f6;
border-radius: 50%;
}
.drag-preview {
position: fixed;
z-index: 1001;
pointer-events: none;
opacity: 0.55;
border-radius: 8px;
box-shadow: 0 8px 24px rgba(0,0,0,0.25);
max-width: 200px;
max-height: 150px;
object-fit: contain;
border: 2px dashed #3b82f6;
background: #f8fafc;
display: none;
transition: opacity 0.15s;
}
.drag-preview.show { display: block; }
.drop-placeholder {
border: 2px dashed #3b82f6 !important;
background: rgba(59, 130, 246, 0.1) !important;
border-radius: 8px;
opacity: 0.5 !important;
pointer-events: none !important;
box-shadow: none !important;
margin: 4px 0;
display: inline-block;
}
.drop-placeholder.inserted-table,
.drop-placeholder.inserted-image,
.drop-placeholder.inserted-video {
display: block !important;
width: 100%;
min-height: 40px;
}
.file-preview-tooltip {
position: fixed;
z-index: 1500;
background: #ffffff;
border: 1px solid #e2e8f0;
border-radius: 12px;
box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
padding: 12px 14px;
max-width: 380px;
min-width: 220px;
pointer-events: none;
opacity: 0;
transform: translateY(4px);
transition: opacity 0.15s ease, transform 0.15s ease;
font-size: 13px;
color: #0f172a;
line-height: 1.5;
overflow: hidden;
}
.file-preview-tooltip.show { opacity: 1; transform: translateY(0); }
.file-preview-tooltip .preview-header {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 8px;
padding-bottom: 8px;
border-bottom: 1px solid #e2e8f0;
}
.file-preview-tooltip .preview-header .preview-icon {
width: 20px;
height: 20px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.file-preview-tooltip .preview-header .preview-icon svg,
.file-preview-tooltip .preview-header .preview-icon img {
width: 20px;
height: 20px;
display: block;
stroke: #0f172a;
}
.file-preview-tooltip .preview-header .preview-icon img {
filter: brightness(0) saturate(100%) invert(15%) sepia(15%) saturate(1000%) hue-rotate(190deg) brightness(95%) contrast(95%);
}
.file-preview-tooltip .preview-header .preview-name {
font-weight: 600;
font-size: 13px;
color: #0f172a;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
flex: 1;
min-width: 0;
}
.file-preview-tooltip .preview-body {
max-height: 220px;
overflow: hidden;
font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
font-size: 12px;
line-height: 1.5;
color: #475569;
white-space: pre-wrap;
word-break: break-word;
}
.file-preview-tooltip .preview-body.text-preview {
font-family: inherit;
font-size: 13px;
}
.file-preview-tooltip .preview-body img,
.file-preview-tooltip .preview-body video,
.file-preview-tooltip .preview-body iframe {
max-width: 100%;
max-height: 200px;
border-radius: 6px;
display: block;
}
.file-preview-tooltip .preview-footer {
margin-top: 8px;
padding-top: 8px;
border-top: 1px solid #e2e8f0;
font-size: 11px;
color: #94a3b8;
display: flex;
justify-content: space-between;
gap: 10px;
}
.file-preview-tooltip .preview-loading {
display: flex;
align-items: center;
gap: 8px;
color: #94a3b8;
font-size: 12px;
padding: 6px 0;
}
.file-preview-tooltip .preview-loading .spinner {
width: 14px;
height: 14px;
border: 2px solid #e2e8f0;
border-top-color: #3b82f6;
border-radius: 50%;
animation: spin 0.8s linear infinite;
}
@keyframes spin {
to { transform: rotate(360deg); }
}
.inserted-table {
border-collapse: collapse;
margin: 12px 0;
width: auto;
min-width: 200px;
background: #ffffff;
border-radius: 8px;
overflow: hidden;
box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
position: relative;
}
.inserted-table td,
.inserted-table th {
border: 1px solid #cbd5e1;
padding: 8px 12px;
min-width: 60px;
min-height: 24px;
font-size: 15px;
color: #0f172a;
vertical-align: top;
outline: none;
position: relative;
}
.inserted-table td:focus,
.inserted-table th:focus {
background: #eff6ff;
box-shadow: inset 0 0 0 2px #3b82f6;
}

<script>
(function() {
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebar = document.getElementById('sidebar');
    const mainArea = document.getElementById('mainArea');
    const editor = document.getElementById('editor');
    const editorContainer = document.getElementById('editorContainer');
    const floatingToolbar = document.getElementById('floatingToolbar');
    const fileInput = document.getElementById('fileInput');
    const vd5Input = document.getElementById('vd5Input');
    const contextMenu = document.getElementById('contextMenu');
    const dragPreview = document.getElementById('dragPreview');
    const filePreviewTooltip = document.getElementById('filePreviewTooltip');
    const saveIndicator = document.getElementById('saveIndicator');
    const linkDialogOverlay = document.getElementById('linkDialogOverlay');
    const linkTitleInput = document.getElementById('linkTitleInput');
    const linkUrlInput = document.getElementById('linkUrlInput');
    const linkDialogCancel = document.getElementById('linkDialogCancel');
    const linkDialogApply = document.getElementById('linkDialogApply');
    const topControls = document.getElementById('topControls');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const STORAGE_KEY = 'vd5_document';
    const VD5_FORMAT = 'vd5';
    const VD5_VERSION = 1;
    let isOpen = false;
    let savedRange = null;
    let contextMenuRange = null;
    let pendingInsertAction = null;
    let selectedImage = null;
    let selectedVideo = null;
    let selectedFile = null;
    let selectedTable = null;
    let selectedLink = null;
    let resizeHandle = null;
    let alignHandle = null;
    let deleteHandle = null;
    let tableAddColBtn = null;
    let tableAddRowBtn = null;
    let tableDeleteBtn = null;
    let isResizing = false;
    let startX = 0, startY = 0;
    let startWidth = 0, startHeight = 0;
    let startRatio = 1;
    let isDragOver = false;
    let dragCounter = 0;
    let linkInsertRange = null;
    let linkInsertMode = null;
    let dropTargetRange = null;
    let dropPlaceholder = null;
    let previewTooltipTimer = null;
    let previewTooltipTarget = null;
    let previewTooltipRequestId = 0;
    let saveTimer = null;
    let isInternalChange = false;
    let isEditingEnabled = false;
    let apiOptions = {};
    let documentId = null;

    const ICON_VOLUME = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';
    const ICON_MUTED = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
    const SVG_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
    const SVG_RESIZE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/><polyline points="21 3 21 9 15 3"/><polyline points="3 21 3 15 9 21"/></svg>';
    const SVG_ALIGN = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="8 8 4 12 8 16"/><polyline points="16 8 20 12 16 16"/></svg>';
    const SVG_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>';

    let historyStack = [];
    let historyIndex = -1;
    let isRestoringHistory = false;
    let historyDebounceTimer = null;

    function updateHistoryButtons() {
        if (!undoBtn || !redoBtn) return;
        undoBtn.disabled = historyIndex <= 0;
        redoBtn.disabled = historyIndex >= historyStack.length - 1;
    }

    function pushHistoryState() {
        if (isRestoringHistory) return;
        const html = editor.innerHTML;
        if (historyIndex >= 0 && historyStack[historyIndex] === html) {
            updateHistoryButtons();
            return;
        }
        historyStack = historyStack.slice(0, historyIndex + 1);
        historyStack.push(html);
        if (historyStack.length > 200) {
            historyStack.shift();
        }
        historyIndex = historyStack.length - 1;
        updateHistoryButtons();
    }

    function scheduleHistoryPush() {
        if (isRestoringHistory) return;
        if (historyDebounceTimer) clearTimeout(historyDebounceTimer);
        historyDebounceTimer = setTimeout(() => {
            historyDebounceTimer = null;
            pushHistoryState();
        }, 300);
    }

    function restoreHistoryState(index) {
        if (index < 0 || index >= historyStack.length) return;
        isRestoringHistory = true;
        isInternalChange = true;
        editor.innerHTML = historyStack[index];
        isInternalChange = false;
        isRestoringHistory = false;
        historyIndex = index;
        initializeAllVideos();
        deselectImage();
        deselectVideo();
        deselectFile();
        deselectTable();
        deselectLink();
        updateHistoryButtons();
        scheduleSave();
    }

    function undo() {
        if (historyIndex > 0) {
            restoreHistoryState(historyIndex - 1);
        }
    }

    function redo() {
        if (historyIndex < historyStack.length - 1) {
            restoreHistoryState(historyIndex + 1);
        }
    }

    if (undoBtn) undoBtn.addEventListener('click', undo);
    if (redoBtn) redoBtn.addEventListener('click', redo);

    function clampX(x, size) {
        return Math.min(Math.max(x, 6), window.innerWidth - size - 6);
    }
    function clampY(y, size) {
        return Math.min(Math.max(y, 6), window.innerHeight - size - 6);
    }

    function formatTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function createDeleteHandle() {
        if (deleteHandle) return deleteHandle;
        const handle = document.createElement('div');
        handle.className = 'delete-handle';
        handle.title = 'Удалить';
        handle.innerHTML = SVG_TRASH;
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const target = selectedImage || selectedVideo || selectedLink || selectedTable;
            if (!target) return;
            target.remove();
            deselectImage();
            deselectVideo();
            deselectLink();
            deselectTable();
            scheduleSave();
        });
        document.body.appendChild(handle);
        deleteHandle = handle;
        return handle;
    }

    function createResizeHandle() {
        if (resizeHandle) return resizeHandle;
        const handle = document.createElement('div');
        handle.className = 'resize-handle';
        handle.title = 'Потяните для изменения размера';
        handle.innerHTML = SVG_RESIZE;
        handle.addEventListener('mousedown', onResizeStart);
        document.addEventListener('mousemove', onResizeMove);
        document.addEventListener('mouseup', onResizeEnd);
        document.body.appendChild(handle);
        resizeHandle = handle;
        return handle;
    }

    function createAlignHandle() {
        if (alignHandle) return alignHandle;
        const handle = document.createElement('div');
        handle.className = 'align-handle';
        handle.title = 'Изменить выравнивание';
        handle.innerHTML = SVG_ALIGN;
        handle.addEventListener('click', onAlignClick);
        document.body.appendChild(handle);
        alignHandle = handle;
        return handle;
    }

    function showHandles(el) {
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const handleSize = 28;
        const resize = createResizeHandle();
        const align = createAlignHandle();
        const del = createDeleteHandle();
        const baseRight = rect.right;
        const baseBottom = rect.bottom;
        align.style.left = clampX(baseRight - handleSize * 3 - 16, handleSize) + 'px';
        align.style.top = clampY(baseBottom - handleSize + 6, handleSize) + 'px';
        align.style.display = 'flex';
        del.style.left = clampX(baseRight - handleSize * 2 - 12, handleSize) + 'px';
        del.style.top = clampY(baseBottom - handleSize + 6, handleSize) + 'px';
        del.style.display = 'flex';
        resize.style.left = clampX(baseRight - handleSize + 6, handleSize) + 'px';
        resize.style.top = clampY(baseBottom - handleSize + 6, handleSize) + 'px';
        resize.style.display = 'flex';
    }

    function showDeleteOnly(el) {
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const handleSize = 28;
        const del = createDeleteHandle();
        const baseRight = rect.right;
        const baseBottom = rect.bottom;
        del.style.left = clampX(baseRight - handleSize + 6, handleSize) + 'px';
        del.style.top = clampY(baseBottom - handleSize + 6, handleSize) + 'px';
        del.style.display = 'flex';
    }

    function hideHandles() {
        if (resizeHandle) resizeHandle.style.display = 'none';
        if (alignHandle) alignHandle.style.display = 'none';
        if (deleteHandle) deleteHandle.style.display = 'none';
    }

    function deselectImage() {
        if (selectedImage) {
            selectedImage.classList.remove('selected');
            selectedImage = null;
        }
        hideHandles();
    }

    function deselectVideo() {
        if (selectedVideo) {
            selectedVideo.classList.remove('selected');
            const videoEl = selectedVideo.querySelector('video');
            if (videoEl && !videoEl.paused) {
                videoEl.pause();
            }
            selectedVideo = null;
        }
        hideHandles();
    }

    function deselectFile() {
        if (selectedFile) {
            selectedFile.classList.remove('selected');
            selectedFile = null;
        }
    }

    function deselectLink() {
        if (selectedLink) {
            selectedLink.classList.remove('selected');
            selectedLink = null;
        }
        hideHandles();
    }

    function selectImage(img) {
        if (selectedImage === img) {
            showHandles(img);
            return;
        }
        deselectImage();
        deselectVideo();
        deselectFile();
        deselectTable();
        deselectLink();
        selectedImage = img;
        img.classList.add('selected');
        showHandles(img);
    }

    function selectVideo(videoWrapper) {
        if (selectedVideo === videoWrapper) {
            showHandles(videoWrapper);
            return;
        }
        deselectImage();
        deselectVideo();
        deselectFile();
        deselectTable();
        deselectLink();
        selectedVideo = videoWrapper;
        videoWrapper.classList.add('selected');
        showHandles(videoWrapper);
    }

    function selectFile(fileEl) {
        if (selectedFile === fileEl) return;
        deselectFile();
        deselectImage();
        deselectVideo();
        deselectTable();
        deselectLink();
        selectedFile = fileEl;
        fileEl.classList.add('selected');
    }

    function selectLink(linkEl) {
        if (selectedLink === linkEl) {
            showDeleteOnly(linkEl);
            return;
        }
        deselectImage();
        deselectVideo();
        deselectFile();
        deselectTable();
        deselectLink();
        selectedLink = linkEl;
        linkEl.classList.add('selected');
        showDeleteOnly(linkEl);
    }

    function createTableAddButtons() {
        if (tableAddColBtn && tableAddRowBtn && tableDeleteBtn) return;
        tableAddColBtn = document.createElement('button');
        tableAddColBtn.className = 'table-add-col';
        tableAddColBtn.title = 'Добавить столбец';
        tableAddColBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            addColumnToTable(selectedTable);
        });
        tableAddRowBtn = document.createElement('button');
        tableAddRowBtn.className = 'table-add-row';
        tableAddRowBtn.title = 'Добавить строку';
        tableAddRowBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            addRowToTable(selectedTable);
        });
        tableDeleteBtn = document.createElement('button');
        tableDeleteBtn.className = 'table-delete-handle';
        tableDeleteBtn.title = 'Удалить таблицу';
        tableDeleteBtn.innerHTML = SVG_TRASH;
        tableDeleteBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (selectedTable) {
                selectedTable.remove();
                deselectTable();
                scheduleSave();
            }
        });
        document.body.appendChild(tableAddColBtn);
        document.body.appendChild(tableAddRowBtn);
        document.body.appendChild(tableDeleteBtn);
    }

    function showTableAddButtons(table) {
        if (!table) return;
        createTableAddButtons();
        const rect = table.getBoundingClientRect();
        const btnSize = 26;
        tableAddColBtn.style.left = clampX(rect.right + 6, btnSize) + 'px';
        tableAddColBtn.style.top = clampY(rect.top + rect.height / 2 - btnSize / 2, btnSize) + 'px';
        tableAddColBtn.classList.add('show');
        tableAddRowBtn.style.left = clampX(rect.left + rect.width / 2 - btnSize / 2, btnSize) + 'px';
        tableAddRowBtn.style.top = clampY(rect.bottom + 6, btnSize) + 'px';
        tableAddRowBtn.classList.add('show');
        tableDeleteBtn.style.left = clampX(rect.right + 6, btnSize) + 'px';
        tableDeleteBtn.style.top = clampY(rect.top - btnSize - 6, btnSize) + 'px';
        tableDeleteBtn.classList.add('show');
    }

    function hideTableAddButtons() {
        if (tableAddColBtn) tableAddColBtn.classList.remove('show');
        if (tableAddRowBtn) tableAddRowBtn.classList.remove('show');
        if (tableDeleteBtn) tableDeleteBtn.classList.remove('show');
    }

    function selectTable(table) {
        if (selectedTable === table) {
            showTableAddButtons(table);
            return;
        }
        deselectTable();
        deselectImage();
        deselectVideo();
        deselectFile();
        deselectLink();
        selectedTable = table;
        showTableAddButtons(table);
    }

    function deselectTable() {
        if (selectedTable) {
            selectedTable = null;
        }
        hideTableAddButtons();
    }

    function addColumnToTable(table) {
        if (!table) return;
        const rows = table.querySelectorAll('tr');
        rows.forEach((row) => {
            const isHeader = row.parentElement.tagName === 'THEAD' ||
                (row.parentElement.tagName === 'TABLE' && row.rowIndex === 0);
            const cell = document.createElement(isHeader ? 'th' : 'td');
            cell.innerHTML = '<br>';
            row.appendChild(cell);
        });
        showTableAddButtons(table);
        editor.focus();
        scheduleSave();
    }

    function addRowToTable(table) {
        if (!table) return;
        const tbody = table.querySelector('tbody') || table;
        const lastRow = tbody.querySelector('tr:last-child');
        if (!lastRow) return;
        const newRow = document.createElement('tr');
        const colCount = lastRow.children.length || 1;
        for (let i = 0; i < colCount; i++) {
            const cell = document.createElement('td');
            cell.innerHTML = '<br>';
            newRow.appendChild(cell);
        }
        tbody.appendChild(newRow);
        showTableAddButtons(table);
        editor.focus();
        scheduleSave();
    }

    function insertTable(range, rows, cols) {
        rows = rows || 3;
        cols = cols || 3;
        const table = document.createElement('table');
        table.className = 'inserted-table';
        table.contentEditable = 'true';
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        for (let c = 0; c < cols; c++) {
            const th = document.createElement('th');
            th.innerHTML = '<br>';
            headerRow.appendChild(th);
        }
        thead.appendChild(headerRow);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        for (let r = 0; r < rows - 1; r++) {
            const tr = document.createElement('tr');
            for (let c = 0; c < cols; c++) {
                const td = document.createElement('td');
                td.innerHTML = '<br>';
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        range.deleteContents();
        range.insertNode(table);
        placeCaretAfter(table);
        editor.focus();
        selectTable(table);
        scheduleSave();
        return table;
    }

    function onResizeStart(e) {
        e.preventDefault();
        e.stopPropagation();
        const target = selectedImage || selectedVideo;
        if (!target) return;
        isResizing = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = target.getBoundingClientRect();
        startWidth = rect.width;
        startHeight = rect.height;
        if (target.style.height && target.style.height !== 'auto') {
            startRatio = parseFloat(target.style.width) / parseFloat(target.style.height);
        } else {
            startRatio = startWidth / startHeight;
        }
    }

    function onResizeMove(e) {
        if (!isResizing) return;
        const target = selectedImage || selectedVideo;
        if (!target) return;
        e.preventDefault();
        const dx = e.clientX - startX;
        let newWidth = startWidth + dx;
        if (newWidth < 30) newWidth = 30;
        let newHeight = newWidth / startRatio;
        target.style.width = newWidth + 'px';
        target.style.height = newHeight + 'px';
        showHandles(target);
    }

    function onResizeEnd() {
        if (!isResizing) return;
        isResizing = false;
        scheduleSave();
    }

    function onAlignClick(e) {
        e.preventDefault();
        e.stopPropagation();
        const target = selectedImage || selectedVideo;
        if (!target) return;
        const currentAlign = target.dataset.align || 'left';
        let nextAlign;
        if (currentAlign === 'left') nextAlign = 'center';
        else if (currentAlign === 'center') nextAlign = 'right';
        else nextAlign = 'left';
        target.dataset.align = nextAlign;
        if (nextAlign === 'left') {
            target.style.display = 'block';
            target.style.marginLeft = '0';
            target.style.marginRight = 'auto';
        } else if (nextAlign === 'center') {
            target.style.display = 'block';
            target.style.marginLeft = 'auto';
            target.style.marginRight = 'auto';
        } else {
            target.style.display = 'block';
            target.style.marginLeft = 'auto';
            target.style.marginRight = '0';
        }
        showHandles(target);
        scheduleSave();
    }

    editor.addEventListener('click', (e) => {
        if (!isEditingEnabled) return;
        const target = e.target;
        if (target.tagName === 'IMG' && target.classList.contains('inserted-image')) {
            e.stopPropagation();
            selectImage(target);
            return;
        }
        const videoWrapper = target.closest && target.closest('.inserted-video');
        if (videoWrapper) {
            e.stopPropagation();
            if (!target.closest('.video-controls-overlay')) {
                selectVideo(videoWrapper);
            }
            return;
        }
        const fileEl = target.closest && target.closest('.inserted-file');
        if (fileEl) {
            e.stopPropagation();
            e.preventDefault();
            selectFile(fileEl);
            return;
        }
        const linkEl = target.closest && target.closest('.inserted-link');
        if (linkEl) {
            e.stopPropagation();
            e.preventDefault();
            selectLink(linkEl);
            return;
        }
        const tableEl = target.closest && target.closest('.inserted-table');
        if (tableEl) {
            deselectImage();
            deselectVideo();
            deselectFile();
            deselectLink();
            selectTable(tableEl);
            return;
        }
        if (target.closest && target.closest('.resize-handle')) return;
        if (target.closest && target.closest('.align-handle')) return;
        if (target.closest && target.closest('.delete-handle')) return;
        if (target.closest && target.closest('.table-add-col')) return;
        if (target.closest && target.closest('.table-add-row')) return;
        if (target.closest && target.closest('.table-delete-handle')) return;
        deselectImage();
        deselectVideo();
        deselectFile();
        deselectTable();
        deselectLink();
    });

    editor.addEventListener('focusin', (e) => {
        if (!isEditingEnabled) return;
        const tableEl = e.target.closest && e.target.closest('.inserted-table');
        if (tableEl) {
            selectTable(tableEl);
        }
    });

    editor.addEventListener('keyup', () => {
        if (!isEditingEnabled) return;
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const node = sel.anchorNode;
        if (!node) return;
        const el = node.nodeType === 1 ? node : node.parentElement;
        const tableEl = el && el.closest && el.closest('.inserted-table');
        if (tableEl) {
            selectTable(tableEl);
        }
    });

    editor.addEventListener('dblclick', (e) => {
        if (!isEditingEnabled) return;
        const fileEl = e.target.closest && e.target.closest('.inserted-file');
        if (!fileEl) return;
        e.preventDefault();
        e.stopPropagation();
        const url = fileEl.dataset.fileurl || fileEl.dataset.objectUrl;
        const name = fileEl.dataset.filename || 'file';
        if (url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    });

    editor.addEventListener('dblclick', (e) => {
        const linkEl = e.target.closest && e.target.closest('.inserted-link');
        if (!linkEl) return;
        e.preventDefault();
        e.stopPropagation();
        const url = linkEl.dataset.url;
        if (url) {
            window.open(url, '_blank');
        }
    });

    document.addEventListener('mousedown', (e) => {
        if (!isEditingEnabled) return;
        const target = e.target;
        if (target.closest && target.closest('.resize-handle')) return;
        if (target.closest && target.closest('.align-handle')) return;
        if (target.closest && target.closest('.delete-handle')) return;
        if (target.closest && target.closest('.table-add-col')) return;
        if (target.closest && target.closest('.table-add-row')) return;
        if (target.closest && target.closest('.table-delete-handle')) return;
        if (target.tagName === 'IMG' && target.classList.contains('inserted-image')) return;
        if (target.closest && target.closest('.inserted-video')) return;
        if (target.closest && target.closest('.inserted-file')) return;
        if (target.closest && target.closest('.inserted-link')) return;
        if (target.closest && target.closest('.inserted-table')) return;
        if (editor.contains(target)) return;
        deselectImage();
        deselectVideo();
        deselectFile();
        deselectTable();
        deselectLink();
    });

    function repositionHandles() {
        if (selectedImage) showHandles(selectedImage);
        if (selectedVideo) showHandles(selectedVideo);
        if (selectedLink) showDeleteOnly(selectedLink);
        if (selectedTable) showTableAddButtons(selectedTable);
    }

    editor.addEventListener('scroll', repositionHandles);
    window.addEventListener('scroll', repositionHandles);
    window.addEventListener('resize', () => {
        repositionHandles();
        hideContextMenu();
    });

    editor.addEventListener('input', () => {
        if (selectedImage && !editor.contains(selectedImage)) deselectImage();
        if (selectedVideo && !editor.contains(selectedVideo)) deselectVideo();
        if (selectedFile && !editor.contains(selectedFile)) deselectFile();
        if (selectedTable && !editor.contains(selectedTable)) deselectTable();
        if (selectedLink && !editor.contains(selectedLink)) deselectLink();
        if (!isInternalChange) {
            scheduleSave();
            scheduleHistoryPush();
        }
    });

    const observer = new MutationObserver(() => {
        if (selectedImage && !editor.contains(selectedImage)) deselectImage();
        if (selectedVideo && !editor.contains(selectedVideo)) deselectVideo();
        if (selectedFile && !editor.contains(selectedFile)) deselectFile();
        if (selectedTable && !editor.contains(selectedTable)) deselectTable();
        if (selectedLink && !editor.contains(selectedLink)) deselectLink();
        if (!isInternalChange) {
            scheduleSave();
            scheduleHistoryPush();
        }
    });
    observer.observe(editor, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['style', 'src', 'data-align', 'data-url', 'data-fileurl', 'data-filename', 'data-filesize', 'data-filetype'] });

    toggleBtn.addEventListener('click', () => {
        isOpen = !isOpen;
        sidebar.classList.toggle('open', isOpen);
        mainArea.classList.toggle('shifted', isOpen);
        toggleBtn.classList.toggle('open', isOpen);
        toggleBtn.textContent = isOpen ? '‹' : '›';
        toggleBtn.title = isOpen ? 'Скрыть панель' : 'Открыть панель';
    });

    function saveSelection() {
        const sel = window.getSelection();
        if (sel.rangeCount > 0 && !sel.isCollapsed) {
            savedRange = sel.getRangeAt(0).cloneRange();
            return true;
        }
        return false;
    }

    function restoreSelection() {
        if (savedRange) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
            return true;
        }
        return false;
    }

    function openLinkDialog(mode, range) {
        linkInsertMode = mode;
        linkInsertRange = range;
        linkTitleInput.value = '';
        linkUrlInput.value = '';
        linkDialogOverlay.classList.add('show');
        linkTitleInput.focus();
    }

    function closeLinkDialog() {
        linkDialogOverlay.classList.remove('show');
        linkInsertRange = null;
        linkInsertMode = null;
    }

    linkDialogCancel.addEventListener('click', closeLinkDialog);
    linkDialogOverlay.addEventListener('mousedown', (e) => {
        if (e.target === linkDialogOverlay) closeLinkDialog();
    });

    linkDialogApply.addEventListener('click', () => {
        const title = linkTitleInput.value.trim();
        let url = linkUrlInput.value.trim();
        if (!title && !url) {
            closeLinkDialog();
            return;
        }
        if (!url) url = title;
        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }
        const linkEl = document.createElement('a');
        linkEl.className = 'inserted-link';
        linkEl.href = url;
        linkEl.target = '_blank';
        linkEl.rel = 'noopener noreferrer';
        linkEl.dataset.url = url;
        linkEl.contentEditable = 'false';
        const titleSpan = document.createElement('span');
        titleSpan.className = 'link-title';
        titleSpan.textContent = title || url;
        const urlSpan = document.createElement('span');
        urlSpan.className = 'link-url';
        urlSpan.textContent = url;
        linkEl.appendChild(titleSpan);
        linkEl.appendChild(urlSpan);
        const range = linkInsertRange || (function() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
                return sel.getRangeAt(0);
            }
            const r = document.createRange();
            r.selectNodeContents(editor);
            r.collapse(false);
            return r;
        })();
        range.deleteContents();
        range.insertNode(linkEl);
        placeCaretAfter(linkEl);
        editor.focus();
        closeLinkDialog();
        selectLink(linkEl);
        scheduleSave();
    });

    function formatText(action) {
        if (!isEditingEnabled) return;
        if (action === 'table') {
            const sel = window.getSelection();
            let range;
            if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
                range = sel.getRangeAt(0);
            } else {
                range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
            }
            insertTable(range);
            return;
        }
        if (action === 'link') {
            const sel = window.getSelection();
            let range;
            if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
                range = sel.getRangeAt(0);
            } else {
                range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
            }
            openLinkDialog('format', range);
            return;
        }
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) {
            return;
        }
        applyFormatting(action);
    }

    function applyFormatting(action) {
        if (!isEditingEnabled) return;
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;
        const range = sel.getRangeAt(0);
        const fragment = range.extractContents();
        const text = fragment.textContent || '';
        let wrapper = document.createElement('span');
        switch (action) {
            case 'bold': wrapper.style.fontWeight = 'bold'; break;
            case 'italic': wrapper.style.fontStyle = 'italic'; break;
            case 'underline': wrapper.style.textDecoration = 'underline'; break;
            case 'strikethrough': wrapper.style.textDecoration = 'line-through'; break;
            case 'code':
                wrapper.style.fontFamily = 'monospace';
                wrapper.style.background = '#e2e8f0';
                wrapper.style.padding = '2px 6px';
                wrapper.style.borderRadius = '4px';
                break;
            case 'highlight':
                wrapper.style.background = '#fef08a';
                wrapper.style.padding = '2px 4px';
                break;
            case 'uppercase': wrapper.style.textTransform = 'uppercase'; break;
            case 'lowercase': wrapper.style.textTransform = 'lowercase'; break;
            case 'larger':
                wrapper.style.fontSize = '24px';
                wrapper.style.fontWeight = 'bold';
                break;
            case 'smaller':
                wrapper.style.fontSize = '14px';
                wrapper.style.color = '#64748b';
                break;
            default:
                wrapper.textContent = text;
        }
        wrapper.textContent = text;
        range.insertNode(wrapper);
        range.setStart(wrapper, 0);
        range.setEnd(wrapper, wrapper.childNodes.length || 0);
        sel.removeAllRanges();
        sel.addRange(range);
        floatingToolbar.querySelectorAll('button').forEach(btn => {
            if (btn.dataset.action === action) {
                btn.classList.add('active');
                setTimeout(() => btn.classList.remove('active'), 500);
            }
        });
        hideFloatingToolbar();
        editor.focus();
        scheduleSave();
    }

    function positionToolbarNearSelection() {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) return false;
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        if (rect.width === 0 && rect.height === 0) return false;
        const toolbarWidth = floatingToolbar.offsetWidth || 400;
        const toolbarHeight = floatingToolbar.offsetHeight || 48;
        let top = rect.top - toolbarHeight - 12;
        let left = rect.left + rect.width / 2 - toolbarWidth / 2;
        if (top < 10) top = rect.bottom + 12;
        if (left < 10) left = 10;
        if (left + toolbarWidth > window.innerWidth - 10) {
            left = window.innerWidth - toolbarWidth - 10;
        }
        if (top + toolbarHeight > window.innerHeight - 10) {
            top = window.innerHeight - toolbarHeight - 10;
        }
        if (top < 10) top = 10;
        floatingToolbar.style.top = top + 'px';
        floatingToolbar.style.left = left + 'px';
        return true;
    }

    function showFloatingToolbar() {
        if (!isEditingEnabled) return;
        if (positionToolbarNearSelection()) {
            floatingToolbar.classList.add('show');
        }
    }

    function hideFloatingToolbar() {
        floatingToolbar.classList.remove('show');
    }

    editor.addEventListener('mouseup', handleSelection);
    editor.addEventListener('keyup', handleSelection);

    function handleSelection() {
        if (!isEditingEnabled) return;
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.rangeCount > 0) {
            const text = sel.toString().trim();
            if (text.length > 0) {
                showFloatingToolbar();
                return;
            }
        }
        hideFloatingToolbar();
    }

    document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!isEditingEnabled) return;
            const action = btn.dataset.action;
            if (action === 'download-vd5') {
                downloadVd5();
                return;
            }
            if (action === 'open-vd5') {
                vd5Input.value = '';
                vd5Input.click();
                return;
            }
            if (action === 'image') {
                pendingInsertAction = 'image';
                fileInput.accept = 'image/*';
                fileInput.value = '';
                fileInput.click();
                return;
            }
            if (action === 'file') {
                pendingInsertAction = 'file';
                fileInput.accept = '';
                fileInput.value = '';
                fileInput.click();
                return;
            }
            formatText(action);
        });
    });

    document.addEventListener('click', (e) => {
        if (!isEditingEnabled) return;
        const isToolbar = floatingToolbar.contains(e.target);
        const isEditor = editor.contains(e.target);
        const isSidebar = sidebar.contains(e.target);
        const isToggle = toggleBtn.contains(e.target);
        const isCtx = contextMenu.contains(e.target);

    function showContextMenu(x, y) {
        if (!isEditingEnabled) return;
        contextMenu.classList.add('show');
        const menuWidth = contextMenu.offsetWidth || 230;
        const menuHeight = contextMenu.offsetHeight || 150;
        let left = x;
        let top = y;
        if (left + menuWidth > window.innerWidth - 10) {
            left = window.innerWidth - menuWidth - 10;
        }
        if (top + menuHeight > window.innerHeight - 10) {
            top = window.innerHeight - menuHeight - 10;
        }
        if (left < 10) left = 10;
        if (top < 10) top = 10;
        contextMenu.style.left = left + 'px';
        contextMenu.style.top = top + 'px';
    }

    function hideContextMenu() {
        contextMenu.classList.remove('show');
    }

    editor.addEventListener('contextmenu', (e) => {
        if (!isEditingEnabled) {
            e.preventDefault();
            return;
        }
        e.preventDefault();
        hideFloatingToolbar();
        const sel = window.getSelection();
        if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
            contextMenuRange = sel.getRangeAt(0).cloneRange();
        } else {
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
            contextMenuRange = range;
        }
        showContextMenu(e.clientX, e.clientY);
    });

    contextMenu.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isEditingEnabled) return;
            const action = btn.dataset.ctx;
            hideContextMenu();
            if (action === 'cancel') {
                contextMenuRange = null;
                pendingInsertAction = null;
                return;
            }
            if (action === 'table') {
                let range = contextMenuRange;
                if (!range || !editor.contains(range.startContainer)) {
                    range = document.createRange();
                    range.selectNodeContents(editor);
                    range.collapse(false);
                }
                contextMenuRange = null;
                pendingInsertAction = null;
                insertTable(range);
                return;
            }
            if (action === 'link') {
                let range = contextMenuRange;
                if (!range || !editor.contains(range.startContainer)) {
                    range = document.createRange();
                    range.selectNodeContents(editor);
                    range.collapse(false);
                }
                contextMenuRange = null;
                pendingInsertAction = null;
                openLinkDialog('context', range);
                return;
            }
            if (action === 'image') {
                pendingInsertAction = 'image';
                fileInput.accept = 'image/*';

    function placeCaretAfter(node) {
        const sel = window.getSelection();
        if (!sel) return;
        const br = document.createElement('br');
        node.parentNode.insertBefore(br, node.nextSibling);
        const space = document.createTextNode('\u200B');
        br.parentNode.insertBefore(space, br.nextSibling);
        const range = document.createRange();
        range.setStart(space, 1);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function getFileIcon(file) {

    function uploadFileToServer(file) {
        return new Promise((resolve, reject) => {
            const fd = new FormData();
            fd.append('file', file);
            const xhr = new XMLHttpRequest();
            xhr.open('POST', apiOptions.uploadUrl || '/upload', true);
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const resp = JSON.parse(xhr.responseText);
                        resolve(resp);
                    } catch (err) {
                        reject(err);
                    }
                } else {
                    reject(new Error('HTTP ' + xhr.status));
                }
            };
            xhr.onerror = () => reject(new Error('network error'));
            xhr.send(fd);
        });
    }

    function initVideoPlayerControls(videoWrapper) {

        let controlsOverlay = videoWrapper.querySelector('.video-controls-overlay');
        if (!controlsOverlay) {
            controlsOverlay = document.createElement('div');
            controlsOverlay.className = 'video-controls-overlay';
            controlsOverlay.innerHTML = `

                    <button class="video-icon-btn video-mute-btn" title="Вкл/выкл звук">

                        </svg>
                    </button>
                    <div class="video-volume-wrapper">
                        <div class="video-volume-fill"></div>

                </div>
                <div class="video-control-group">
                    <select class="video-speed-select">

                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                        <option value="3">3x</option>
                    </select>
                </div>
            </div>
            `;
            videoWrapper.appendChild(controlsOverlay);
        }

        const timeCurrent = controlsOverlay.querySelector('.video-time-current');
        const timeDuration = controlsOverlay.querySelector('.video-time-duration');
        const progressBar = controlsOverlay.querySelector('.video-progress-bar');
        const progressFill = controlsOverlay.querySelector('.video-progress-fill');
        const muteBtn = controlsOverlay.querySelector('.video-mute-btn');
        const volumeIcon = controlsOverlay.querySelector('.video-volume-icon');
        const volumeSlider = controlsOverlay.querySelector('.video-volume-slider');
        const volumeFill = controlsOverlay.querySelector('.video-volume-fill');
        const speedSelect = controlsOverlay.querySelector('.video-speed-select');

        function formatTimeLocal(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        let rafId = null;
        function smoothProgress() {
            if (!video.src) {
                rafId = requestAnimationFrame(smoothProgress);
                return;
            }
            const duration = video.duration;
            const currentTime = video.currentTime;
            if (duration && isFinite(duration)) {
                timeDuration.textContent = formatTimeLocal(duration);
            }
            timeCurrent.textContent = formatTimeLocal(currentTime);
            if (duration && isFinite(duration) && duration > 0) {
                const percent = (currentTime / duration) * 100;
                progressFill.style.width = `${percent}%`;
            }
            rafId = requestAnimationFrame(smoothProgress);
        }
        rafId = requestAnimationFrame(smoothProgress);

        function updateVolumeUI() {
            const muted = video.muted || video.volume === 0;
            volumeIcon.querySelector('path').setAttribute('d', muted ? ICON_MUTED : ICON_VOLUME);
            const val = muted ? 0 : video.volume;
            volumeSlider.value = val;
            volumeFill.style.width = `${val * 100}%`;
        }

        function setPlaybackRate(rate) {
            video.playbackRate = rate;
            for (let i = 0; i < speedSelect.options.length; i++) {
                const opt = speedSelect.options[i];
                if (parseFloat(opt.value) === rate) {
                    speedSelect.selectedIndex = i;
                    break;
                }
            }
        }

        setPlaybackRate(1);
        updateVolumeUI();

        video.addEventListener('loadedmetadata', () => {
            setPlaybackRate(1);
            speedSelect.value = '1';
        });

        video.addEventListener('volumechange', updateVolumeUI);

        video.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.paused) {
                video.play().catch(e => console.log('Ошибка воспроизведения:', e));
            } else {
                video.pause();
            }
        });

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            video.muted = !video.muted;
        });

        volumeSlider.addEventListener('input', (e) => {
            e.stopPropagation();
            const val = parseFloat(e.target.value);
            video.volume = val;
            video.muted = (val === 0);
            volumeFill.style.width = `${val * 100}%`;
        });

        controlsOverlay.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        speedSelect.addEventListener('change', (e) => {
            setPlaybackRate(parseFloat(e.target.value));
        });

        progressBar.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!video.src || !video.duration || !isFinite(video.duration)) return;
            const rect = progressBar.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const width = rect.width;
            const percent = Math.min(1, Math.max(0, x / width));
            video.currentTime = percent * video.duration;
        });

        progressBar.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    function initializeAllVideos() {
        const videos = editor.querySelectorAll('.inserted-video');
        videos.forEach(vw => {

            if (video && !vw.querySelector('.video-controls-overlay')) {
                initVideoPlayerControls(vw);
