<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>editor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='text_redactor.css') }}">
</head>
<body>
<button class="toggle-btn" id="toggleBtn" title="Открыть панель" style="display:none">›</button>
<div class="top-controls" id="topControls">
<button id="undoBtn" title="Отменить (Ctrl+Z)" disabled>
<img src="{{ url_for('static', filename='data/undo.png') }}" alt="Отменить" />
</button>
<button id="redoBtn" title="Повторить (Ctrl+Shift+Z)" disabled>
<img src="{{ url_for('static', filename='data/redo.png') }}" alt="Повторить" />
</button>
</div>
<aside class="sidebar" id="sidebar" style="display:none">
<button class="icon-btn" title="Большая" data-action="larger">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
</button>
<button class="icon-btn" title="Жирная" data-action="bold">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
</button>
<button class="icon-btn" title="Маленькая" data-action="smaller">
<span class="text-icon">m</span>
</button>
<button class="icon-btn" title="Подчёркнутый" data-action="underline">
<img src="{{ url_for('static', filename='data/baseline.svg') }}" alt="U" class="icon-white" />
</button>
<button class="icon-btn" title="Зачёркнутый" data-action="strikethrough">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
</button>
<button class="icon-btn" title="Таблица" data-action="table">
<img src="{{ url_for('static', filename='data/table.svg') }}" alt="T" class="icon-white" />
</button>
<button class="icon-btn" title="Маркер" data-action="highlight">
<img src="{{ url_for('static', filename='data/marker.svg') }}" alt="маркер" class="icon-white" />
</button>
<button class="icon-btn" title="Код" data-action="code">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
</button>
<button class="icon-btn" title="Ссылка" data-action="link">
<img src="{{ url_for('static', filename='data/external-link.svg') }}" alt="ссылка" class="icon-white" />
</button>
<button class="icon-btn" title="Изображение" data-action="image">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
</button>
<button class="icon-btn" title="Файл" data-action="file">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
</button>
<div class="sidebar-sep"></div>
<button class="icon-btn" title="Сохранить .vd5" data-action="download-vd5">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
</button>
<button class="icon-btn" title="Открыть .vd5" data-action="open-vd5">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
</button>
</aside>
<div class="main-area" id="mainArea">
<div class="editor-container" id="editorContainer">
<div id="editor" contenteditable="true"></div>
</div>
</div>
<div class="floating-toolbar" id="floatingToolbar">
<span class="tool-label">Формат</span>
<button data-action="bold" title="Жирный">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
</button>
<button data-action="italic" title="Курсив">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
</button>
<button data-action="underline" title="Подчёркнутый">
<img src="{{ url_for('static', filename='data/baseline.svg') }}" alt="U" class="icon-white" />
</button>
<button data-action="strikethrough" title="Зачёркнутый">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
</button>
<div class="divider"></div>
<button data-action="code" title="Код">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
</button>
<button data-action="highlight" title="Маркер">
<img src="{{ url_for('static', filename='data/marker.svg') }}" alt="маркер" class="icon-white" />
</button>
<div class="divider"></div>
<button data-action="link" title="Ссылка">
<img src="{{ url_for('static', filename='data/external-link.svg') }}" alt="ссылка" class="icon-white" />
</button>
</div>
<input type="file" id="fileInput" hidden />
<input type="file" id="vd5Input" accept=".vd5,application/json" hidden />
<div class="context-menu" id="contextMenu">
<div class="menu-title">Вставить</div>
<button data-ctx="table">
<span class="menu-icon">
<img src="{{ url_for('static', filename='data/table.svg') }}" alt="" />
</span>
Вставить таблицу
</button>
<button data-ctx="image">
<span class="menu-icon">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
</span>
Вставить изображение…
</button>
<button data-ctx="file">
<span class="menu-icon">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
</span>
Вставить файл…
</button>
<button data-ctx="link">
<span class="menu-icon">
<img src="{{ url_for('static', filename='data/external-link.svg') }}" alt="" />
</span>
Вставить ссылку…
</button>
<div class="menu-sep"></div>
<button data-ctx="cancel" class="danger">
<span class="menu-icon">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="18" y1="6" x2="6" y2="18"></line>
<line x1="6" y1="6" x2="18" y2="18"></line>
</svg>
</span>
Отмена
</button>
</div>
<div class="link-dialog-overlay" id="linkDialogOverlay">
<div class="link-dialog">
<h3>Вставить ссылку</h3>
<label for="linkTitleInput">Название</label>
<input type="text" id="linkTitleInput" placeholder="Например: Яндекс" />
<label for="linkUrlInput">Ссылка</label>
<input type="text" id="linkUrlInput" placeholder="https://example.com" />
<div class="dialog-actions">
<button class="btn-cancel" id="linkDialogCancel">Отмена</button>
<button class="btn-apply" id="linkDialogApply">Вставить</button>
</div>
</div>
</div>
<img class="drag-preview" id="dragPreview" alt="" />
<div class="file-preview-tooltip" id="filePreviewTooltip">
<div class="preview-header">
<span class="preview-icon">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
</span>
<span class="preview-name"></span>
</div>
<div class="preview-body"></div>
<div class="preview-footer">
<span class="preview-type"></span>
<span class="preview-size"></span>
</div>
</div>
<script>
  window.VD5_CONFIG = {
    storageKey: "vd5_doc_{{ request.args.get('id', 'new') }}",
    uploadUrl: "{{ url_for('upload') }}",
    editable: {{ 'true' if request.args.get('admin') is not none else 'false' }},
    initialContent: {{ (initial_content or '')|tojson }}
  };
</script>
<script src="{{ url_for('static', filename='text_redactor.js') }}"></script>
</body>
</html>
