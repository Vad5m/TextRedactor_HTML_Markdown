<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            background: #f0f2f5;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .toggle-btn {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            z-index: 200;
            width: 32px;
            height: 60px;
            background: #1e293b;
            color: #f1f5f9;
            border: none;
            border-radius: 0 12px 12px 0;
            font-size: 20px;
            font-weight: 300;
            cursor: pointer;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.1);
        }

        .toggle-btn:hover {
            background: #334155;
        }

        .toggle-btn.open {
            left: 64px;
        }

        .sidebar {
            position: fixed;
            top: 50%;
            left: -64px;
            transform: translateY(-50%);
            width: 64px;
            height: 480px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 5px;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            z-index: 100;
            border-radius: 0 16px 16px 0;
            overflow: visible;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -40px;
            width: 80px;
            height: 80px;
            background: #1e293b;
            z-index: -1;
            mask-image: radial-gradient(circle at 100% 0%, transparent 40px, black 40px);
            -webkit-mask-image: radial-gradient(circle at 100% 0%, transparent 40px, black 40px);
        }

        .sidebar::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 80px;
            height: 80px;
            background: #1e293b;
            z-index: -1;
            mask-image: radial-gradient(circle at 100% 100%, transparent 40px, black 40px);
            -webkit-mask-image: radial-gradient(circle at 100% 100%, transparent 40px, black 40px);
        }

        .sidebar button {
            width: 44px;
            height: 33px;
            border: none;
            background: #334155;
            color: #f1f5f9;
            font-size: 18px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 0 10px 10px 0;
            position: relative;
            z-index: 1;
            font-family: inherit;
            line-height: 1;
            padding: 0;
            transition: background 0.15s, transform 0.3s ease;
        }

        .sidebar button:hover {
            background: #475569;
            transform: rotate(15deg);
        }

        .sidebar button:active {
            background: #0f172a;
            transform: scale(0.92) rotate(15deg);
        }

        .sidebar button:nth-child(1) {
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .sidebar button:nth-child(2) {
            font-size: 32px;
            font-weight: 700;
        }
        .sidebar button:nth-child(3) {
            font-size: 22px;
            font-weight: 900;
        }
        .sidebar button:nth-child(4) {
            font-size: 12px;
            font-weight: 400;
        }
        .sidebar button:nth-child(5) {
            font-size: 20px;
            font-weight: 400;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 2px;
        }
        .sidebar button:nth-child(6) {
            font-size: 20px;
            font-weight: 400;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }
        .sidebar button:nth-child(7) {
            font-size: 20px;
            font-weight: 400;
            border: 1px solid #64748b;
            padding: 0 2px;
        }
        .sidebar button:nth-child(10) {
            font-size: 18px;
            font-weight: 400;
            text-decoration: underline;
            text-underline-offset: 5px;
            text-decoration-color: #60a5fa;
        }
        .sidebar button:nth-child(11) {
            font-size: 20px;
            font-weight: 400;
        }

        .sidebar button.code-btn {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: 700;
            background: #0f172a;
            letter-spacing: 0.5px;
        }
        .sidebar button.code-btn:hover {
            background: #1e293b;
        }

        .sidebar button.marker-btn {
            background: #334155;
            padding: 0;
            overflow: hidden;
        }
        .sidebar button.marker-btn:hover {
            background: #475569;
        }
        .sidebar button.marker-btn:active {
            background: #0f172a;
        }

        .marker-svg-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .marker-svg-wrapper svg {
            width: 16px;
            height: 16px;
            fill: #f1f5f9;
            transition: fill 0.15s;
        }

        .sidebar button.file-btn {
            background: transparent;
            padding: 0;
            width: 44px;
            height: 33px;
            border-radius: 0 10px 10px 0;
            background: #334155;
            transition: background 0.15s, transform 0.3s ease;
        }
        .sidebar button.file-btn:hover {
            background: #475569;
        }
        .sidebar button.file-btn:active {
            background: #0f172a;
            transform: scale(0.92) rotate(15deg);
        }

        .file-svg-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .file-svg-wrapper svg {
            width: 20px;
            height: 20px;
            stroke: #f1f5f9;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block;
        }

        .main-area {
            margin-left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: stretch;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1), width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-area.shifted {
            margin-left: 64px;
            width: calc(100% - 64px);
        }

        .editor-container {
            width: 100%;
            height: 100%;
            padding: 20px 30px;
            background: #f8fafc;
            overflow-y: auto;
            position: relative;
        }

        #editor {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            font-size: 18px;
            font-family: inherit;
            color: #0f172a;
            line-height: 1.6;
            background: transparent;
            resize: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #editor:empty::before {
            content: 'Введите текст...';
            color: #94a3b8;
        }

        #editor:focus:empty::before {
            content: '';
        }

        .floating-toolbar {
            position: fixed;
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 16px;
            display: flex;
            gap: 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            z-index: 300;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            align-items: center;
            transform: scale(0.95) translateY(4px);
            top: 0;
            left: 0;
        }

        .floating-toolbar.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .floating-toolbar button {
            background: transparent;
            border: none;
            color: #f1f5f9;
            font-size: 18px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
            font-family: inherit;
            line-height: 1;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-toolbar button:hover {
            background: #334155;
            transform: scale(1.05);
        }

        .floating-toolbar button:active {
            background: #0f172a;
            transform: scale(0.92);
        }

        .floating-toolbar button.active {
            background: #3b82f6;
            color: white;
        }

        .floating-toolbar .divider {
            width: 1px;
            height: 28px;
            background: #475569;
            margin: 0 4px;
        }

        .floating-toolbar .tool-label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-right: 4px;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 54px;
                height: 400px;
                padding: 10px 0;
                gap: 4px;
                left: -54px;
            }
            .sidebar.open {
                left: 0;
            }
            .toggle-btn.open {
                left: 54px;
            }
            .sidebar button {
                width: 38px;
                height: 28px;
                font-size: 15px;
            }
            .sidebar button:nth-child(2) {
                font-size: 26px;
            }
            .sidebar button.code-btn {
                font-size: 14px;
            }
            .sidebar button.file-btn {
                width: 38px;
                height: 28px;
            }
            .sidebar button.marker-btn {
                width: 38px;
                height: 28px;
            }
            .file-svg-wrapper svg {
                width: 17px;
                height: 17px;
            }
            .marker-svg-wrapper svg {
                width: 14px;
                height: 14px;
            }
            .main-area.shifted {
                margin-left: 54px;
                width: calc(100% - 54px);
            }
            .floating-toolbar {
                padding: 6px 10px;
                gap: 4px;
            }
            .floating-toolbar button {
                font-size: 15px;
                padding: 4px 7px;
                min-width: 30px;
            }
            .floating-toolbar .tool-label {
                font-size: 9px;
            }
            .editor-container {
                padding: 16px 20px;
            }
            #editor {
                font-size: 16px;
            }
        }

        @media (max-width: 420px) {
            .sidebar {
                width: 44px;
                height: 360px;
                padding: 8px 0;
                gap: 3px;
                left: -44px;
            }
            .sidebar.open {
                left: 0;
            }
            .toggle-btn.open {
                left: 44px;
            }
            .sidebar button {
                width: 32px;
                height: 24px;
                font-size: 12px;
            }
            .sidebar button:nth-child(2) {
                font-size: 20px;
            }
            .sidebar button.code-btn {
                font-size: 12px;
            }
            .sidebar button.file-btn {
                width: 32px;
                height: 24px;
            }
            .sidebar button.marker-btn {
                width: 32px;
                height: 24px;
            }
            .file-svg-wrapper svg {
                width: 14px;
                height: 14px;
            }
            .marker-svg-wrapper svg {
                width: 12px;
                height: 12px;
            }
            .main-area.shifted {
                margin-left: 44px;
                width: calc(100% - 44px);
            }
            .floating-toolbar {
                padding: 5px 8px;
                gap: 2px;
                border-radius: 12px;
            }
            .floating-toolbar button {
                font-size: 13px;
                padding: 3px 5px;
                min-width: 26px;
            }
            .floating-toolbar .tool-label {
                font-size: 8px;
                padding-right: 2px;
            }
            .floating-toolbar .divider {
                height: 22px;
                margin: 0 2px;
            }
            .editor-container {
                padding: 12px 14px;
            }
            #editor {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <button class="toggle-btn" id="toggleBtn" title="Открыть панель">›</button>

    <aside class="sidebar" id="sidebar">
        <button title="Заглавная" data-action="uppercase">А</button>
        <button title="Большая" data-action="larger">А</button>
        <button title="Жирная" data-action="bold">А</button>
        <button title="Маленькая" data-action="smaller">а</button>
        <button title="Подчёркнутый" data-action="underline">А</button>
        <button title="Зачёркнутый" data-action="strikethrough">А</button>
        <button title="Таблица" data-action="table">Т</button>

        <button class="marker-btn" title="Маркер" data-action="highlight">
            <span class="marker-svg-wrapper">
                <svg viewBox="0 0 512 512">
                    <path d="M410.3 231l11.3-11.3-33.9-33.9-62.1-62.1L291.7 89.8l-11.3 11.3-22.6 22.6L58.6 322.9c-10.4 10.4-18 23.3-22.2 37.4L1 480.7c-2.5 8.4-.2 17.5 6.1 23.7s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L387.7 253.7 410.3 231zM160 399.4l-9.1 22.7c-4 3.1-8.5 5.4-13.3 6.9L59.4 452l23-78.1c1.4-4.9 3.8-9.4 6.9-13.3l22.7-9.1v32c0 8.8 7.2 16 16 16h32zM362.7 18.7L348.3 33.2 325.7 55.8 314.3 67.1l33.9 33.9 62.1 62.1 33.9 33.9 11.3-11.3 22.6-22.6 14.5-14.5c25-25 25-65.5 0-90.5L453.3 18.7c-25-25-65.5-25-90.5 0zm-47.4 168l-144 144c-6.2 6.2-16.4 6.2-22.6 0s-6.2-16.4 0-22.6l144-144c6.2-6.2 16.4-6.2 22.6 0s6.2 16.4 0 22.6z" />
                </svg>
            </span>
        </button>

        <button class="code-btn" title="Код" data-action="code">&lt;/&gt;</button>

        <button title="Ссылка" data-action="link">С</button>
        <button title="Изображение" data-action="image">И</button>

        <button class="file-btn" title="Файл" data-action="file">
            <span class="file-svg-wrapper">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
            </span>
        </button>
    </aside>

    <div class="main-area" id="mainArea">
        <div class="editor-container">
            <div id="editor" contenteditable="true"></div>
        </div>
    </div>

    <div class="floating-toolbar" id="floatingToolbar">
        <span class="tool-label">Формат</span>
        <button data-action="bold" title="Жирный"><strong>B</strong></button>
        <button data-action="italic" title="Курсив"><em>I</em></button>
        <button data-action="underline" title="Подчёркнутый"><u>U</u></button>
        <button data-action="strikethrough" title="Зачёркнутый"><s>S</s></button>
        <div class="divider"></div>
        <button data-action="uppercase" title="Заглавные">Aa</button>
        <button data-action="lowercase" title="Строчные">aA</button>
        <div class="divider"></div>
        <button data-action="code" title="Код">&lt;/&gt;</button>
        <button data-action="highlight" title="Маркер">🖍</button>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebar = document.getElementById('sidebar');
        const mainArea = document.getElementById('mainArea');
        const editor = document.getElementById('editor');
        const floatingToolbar = document.getElementById('floatingToolbar');

        let isOpen = false;
        let savedRange = null;

        toggleBtn.addEventListener('click', () => {
            isOpen = !isOpen;
            sidebar.classList.toggle('open', isOpen);
            mainArea.classList.toggle('shifted', isOpen);
            toggleBtn.classList.toggle('open', isOpen);
            toggleBtn.textContent = isOpen ? '‹' : '›';
            toggleBtn.title = isOpen ? 'Скрыть панель' : 'Открыть панель';
        });

        function saveSelection() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0 && !sel.isCollapsed) {
                savedRange = sel.getRangeAt(0).cloneRange();
                return true;
            }
            return false;
        }

        function restoreSelection() {
            if (savedRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
                return true;
            }
            return false;
        }

        function formatText(action) {
            const sel = window.getSelection();

            if (!sel || sel.isCollapsed) {
                const examples = {
                    bold: 'жирный текст',
                    italic: 'курсивный текст',
                    underline: 'подчёркнутый текст',
                    strikethrough: 'зачёркнутый текст',
                    uppercase: 'ЗАГЛАВНЫЙ ТЕКСТ',
                    lowercase: 'строчный текст',
                    code: 'код',
                    highlight: 'выделенный текст',
                    larger: 'БОЛЬШОЙ ТЕКСТ',
                    smaller: 'маленький текст',
                    table: 'заголовок\nячейка',
                    link: 'текст ссылки',
                    image: 'альт текст',
                    file: 'файл'
                };
                const example = examples[action] || 'текст';

                const range = sel.getRangeAt(0);
                const textNode = document.createTextNode(example);
                range.insertNode(textNode);

                range.setStart(textNode, 0);
                range.setEnd(textNode, example.length);
                sel.removeAllRanges();
                sel.addRange(range);

                applyFormatting(action);
                return;
            }

            applyFormatting(action);
        }

        function applyFormatting(action) {
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed) return;

            const range = sel.getRangeAt(0);
            const fragment = range.extractContents();
            const text = fragment.textContent || '';

            let wrapper = document.createElement('span');

            switch (action) {
                case 'bold':
                    wrapper.style.fontWeight = 'bold';
                    break;
                case 'italic':
                    wrapper.style.fontStyle = 'italic';
                    break;
                case 'underline':
                    wrapper.style.textDecoration = 'underline';
                    break;
                case 'strikethrough':
                    wrapper.style.textDecoration = 'line-through';
                    break;
                case 'code':
                    wrapper.style.fontFamily = 'monospace';
                    wrapper.style.background = '#e2e8f0';
                    wrapper.style.padding = '2px 6px';
                    wrapper.style.borderRadius = '4px';
                    break;
                case 'highlight':
                    wrapper.style.background = '#fef08a';
                    wrapper.style.padding = '2px 4px';
                    break;
                case 'uppercase':
                    wrapper.style.textTransform = 'uppercase';
                    break;
                case 'lowercase':
                    wrapper.style.textTransform = 'lowercase';
                    break;
                case 'larger':
                    wrapper.style.fontSize = '24px';
                    wrapper.style.fontWeight = 'bold';
                    break;
                case 'smaller':
                    wrapper.style.fontSize = '14px';
                    wrapper.style.color = '#64748b';
                    break;
                case 'link':
                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = text;
                    link.style.color = '#3b82f6';
                    link.style.textDecoration = 'underline';
                    link.style.cursor = 'pointer';
                    wrapper = link;
                    break;
                case 'image':
                    const img = document.createElement('span');
                    img.textContent = '🖼️ ' + text;
                    img.style.background = '#f1f5f9';
                    img.style.padding = '4px 12px';
                    img.style.borderRadius = '8px';
                    img.style.display = 'inline-block';
                    wrapper = img;
                    break;
                case 'file':
                    const file = document.createElement('span');
                    file.textContent = '📎 ' + text;
                    file.style.background = '#e2e8f0';
                    file.style.padding = '4px 12px';
                    file.style.borderRadius = '8px';
                    file.style.display = 'inline-block';
                    wrapper = file;
                    break;
                case 'table':
                    const table = document.createElement('div');
                    table.style.display = 'inline-block';
                    table.style.border = '1px solid #94a3b8';
                    table.style.borderRadius = '4px';
                    table.style.padding = '4px';
                    table.style.background = 'white';
                    const rows = text.split('\n');
                    rows.forEach(rowText => {
                        const row = document.createElement('div');
                        row.style.display = 'flex';
                        row.style.borderBottom = '1px solid #e2e8f0';
                        row.style.padding = '2px 8px';
                        const cell = document.createElement('span');
                        cell.textContent = rowText || ' ';
                        row.appendChild(cell);
                        table.appendChild(row);
                    });
                    wrapper = table;
                    break;
                default:
                    wrapper.textContent = text;
            }

            if (!['link', 'image', 'file', 'table'].includes(action)) {
                wrapper.textContent = text;
            }

            range.insertNode(wrapper);

            range.setStart(wrapper, 0);
            range.setEnd(wrapper, wrapper.childNodes.length || 0);
            sel.removeAllRanges();
            sel.addRange(range);

            floatingToolbar.querySelectorAll('button').forEach(btn => {
                if (btn.dataset.action === action) {
                    btn.classList.add('active');
                    setTimeout(() => btn.classList.remove('active'), 500);
                }
            });

            hideFloatingToolbar();
            editor.focus();
        }

        function positionToolbarNearSelection() {
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || sel.rangeCount === 0) return false;

            const range = sel.getRangeAt(0);
            const rect = range.getBoundingClientRect();

            if (rect.width === 0 && rect.height === 0) return false;

            const toolbarWidth = floatingToolbar.offsetWidth || 400;
            const toolbarHeight = floatingToolbar.offsetHeight || 48;

            let top = rect.top - toolbarHeight - 12;
            let left = rect.left + rect.width / 2 - toolbarWidth / 2;

            if (top < 10) {
                top = rect.bottom + 12;
            }

            if (left < 10) left = 10;
            if (left + toolbarWidth > window.innerWidth - 10) {
                left = window.innerWidth - toolbarWidth - 10;
            }

            if (top + toolbarHeight > window.innerHeight - 10) {
                top = window.innerHeight - toolbarHeight - 10;
            }
            if (top < 10) top = 10;

            floatingToolbar.style.top = top + 'px';
            floatingToolbar.style.left = left + 'px';

            return true;
        }

        function showFloatingToolbar() {
            if (positionToolbarNearSelection()) {
                floatingToolbar.classList.add('show');
            }
        }

        function hideFloatingToolbar() {
            floatingToolbar.classList.remove('show');
        }

        editor.addEventListener('mouseup', handleSelection);
        editor.addEventListener('keyup', handleSelection);

        function handleSelection() {
            const sel = window.getSelection();
            if (sel && !sel.isCollapsed && sel.rangeCount > 0) {
                const text = sel.toString().trim();
                if (text.length > 0) {
                    showFloatingToolbar();
                    return;
                }
            }
            hideFloatingToolbar();
        }

        document.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const action = btn.dataset.action;
                formatText(action);
            });
        });

        document.addEventListener('click', (e) => {
            const isToolbar = floatingToolbar.contains(e.target);
            const isEditor = editor.contains(e.target);
            const isSidebar = sidebar.contains(e.target);
            const isToggle = toggleBtn.contains(e.target);

            if (!isToolbar && !isEditor && !isSidebar && !isToggle) {
                hideFloatingToolbar();
            }
        });

        editor.addEventListener('input', () => {
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed) {
                hideFloatingToolbar();
            }
        });

        sidebar.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        window.addEventListener('resize', () => {
            if (floatingToolbar.classList.contains('show')) {
                positionToolbarNearSelection();
            }
        });

        function getHTML() {
            return editor.innerHTML;
        }

        function getText() {
            return editor.textContent;
        }

        window.getHTML = getHTML;
        window.getText = getText;
    </script>
</body>
</html>
